# ── Perfil "local" — localhost, sin Docker ──────────────────────────────────
# Eureka de una sola instancia en tu maquina. Para que este servicio y los que
# le hablan (o a los que le habla) se encuentren, TODOS deben correr con este
# mismo perfil "local" y apuntar al mismo Eureka:
#   1. ms1-eureka-server: .\mvnw spring-boot:run   (sin perfil, ya es standalone)
#   2. Este servicio:     .\mvnw spring-boot:run "-Dspring-boot.run.profiles=local"
eureka.client.service-url.defaultZone=http://admin:admin123@localhost:8761/eureka/

# Default de desarrollo SOLO para este perfil — en cualquier otro ambiente real
# la variable de entorno DB_PASSWORD es obligatoria y no tiene default (ver
# application.properties y XRELLO_CONTRATO.md §3, "credenciales siempre por
# variable de entorno").
spring.datasource.username=${DB_USERNAME:xrello}
spring.datasource.password=${DB_PASSWORD:xrello_local_2026}

# Secreto JWT: SIN default, tambien en local (hereda ${XRELLO_JWT_SECRET} de application.properties).
# Los procesos nativos escuchan en todas las interfaces y las reglas de firewall por programa dejan pasar
# java.exe: un default versionado permitiria firmar un token del emisor local con el correo de cualquiera.
# Definelo en .env (plantilla: .env.example; los launch.json lo cargan con envFile). DEBE ser el mismo
# valor en ms-xrello-cuentas y ms-xrello-tableros (minimo 32 caracteres).

# ── Authorization Server (ms3-oauth): segundo emisor aceptado, convive con el emisor local ──
# jwk-set-uri + issuer-uri JUNTAS: el issuer se valida localmente y el JWKS se descarga de forma
# perezosa (primer token). NO usar JwtDecoders.fromIssuerLocation: consulta el discovery al ARRANCAR
# y el servicio no levantaria con ms3-oauth caido. El issuer es el valor de app.oauth.issuer de ms3-oauth.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8010/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8010

# ── Trazas: exportacion a Zipkin por RabbitMQ (infra-tracing) ───────────────────────────────────────
# Apagada por defecto para poder arrancar sin la infraestructura de trazas. Para enviar trazas:
#   TRACING_ENABLED=true, ZIPKIN_RABBIT_USERNAME y ZIPKIN_RABBIT_PASSWORD (los valores de infra-tracing/.env,
#   RABBIT_USERNAME / RABBIT_PASSWORD). Con TRACING_ENABLED=true y sin las credenciales el arranque aborta.
management.zipkin.tracing.export.enabled=${TRACING_ENABLED:false}
app.tracing.rabbit.enabled=${TRACING_ENABLED:false}
app.tracing.rabbit.addresses=localhost:5672
app.tracing.rabbit.username=${ZIPKIN_RABBIT_USERNAME:}
app.tracing.rabbit.password=${ZIPKIN_RABBIT_PASSWORD:}
