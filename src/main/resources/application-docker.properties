# ── Perfil "docker" — ejecucion en contenedor ───────────────────────────────
# Se activa por defecto en la imagen (ver Dockerfile: ENV SPRING_PROFILES_ACTIVE=docker).
# Para correr localmente contra este perfil sin Docker:
#   .\mvnw spring-boot:run "-Dspring-boot.run.profiles=docker"

# Eureka HA (peer1/peer2/peer3): resoluble porque este contenedor y los 3
# peers de eureka-server comparten la red externa "cagr-net" (ver
# docker-compose.yml), donde el hostname de cada peer coincide con su nombre
# de servicio.
eureka.client.service-url.defaultZone=http://admin:admin123@peer1:8761/eureka/,http://admin:admin123@peer2:8762/eureka/,http://admin:admin123@peer3:8763/eureka/

# host.docker.internal resuelve al host anfitrion desde Docker Desktop
# (Windows/Mac) — ver docker-compose.yml (extra_hosts) para tambien
# soportarlo en Linux. db_xrello es una base PROPIA (nunca db_ms_products,
# ver XRELLO_CONTRATO.md §3) — el default de host/puerto/usuario de abajo
# asume un MySQL de desarrollo local con esa base y usuario ya creados (ver
# sql/00_crear_base_y_usuario.sql).
#
# DB_PASSWORD SIN default a proposito: a diferencia de host/puerto/usuario,
# la contraseña nunca debe tener un valor de repuesto ni siquiera para Docker
# de desarrollo — si falta, el arranque debe fallar de forma obvia en vez de
# conectar con una contraseña adivinable. El unico lugar del proyecto con
# default de contraseña es application-local.properties (ejecucion nativa,
# sin contenedor).
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/db_xrello?useSSL=false&serverTimezone=UTC&sessionVariables=time_zone='%2B00:00'&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# XRELLO_JWT_SECRET: mismo criterio que DB_PASSWORD arriba — SIN default, ni siquiera para
# Docker de desarrollo (heredado de application.properties; no se sobreescribe aqui).

# ── Authorization Server (ms3-oauth): segundo emisor aceptado, convive con el emisor local ──
# jwk-set-uri + issuer-uri JUNTAS: el issuer se valida localmente y el JWKS se descarga de forma
# perezosa (primer token). NO usar JwtDecoders.fromIssuerLocation: consulta el discovery al ARRANCAR
# y el servicio no levantaria con ms3-oauth caido. El issuer es el valor de app.oauth.issuer de ms3-oauth.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://ms3-oauth:8010/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8010

# ── Trazas: exportacion a Zipkin por RabbitMQ (infra-tracing, misma red cagr-net) ───────────────────
# Encendida siempre en contenedor. Las credenciales llegan por el compose (.env); sin ellas el arranque aborta
# nombrando la variable.
management.zipkin.tracing.export.enabled=true
app.tracing.rabbit.enabled=true
app.tracing.rabbit.addresses=rabbitmq:5672
app.tracing.rabbit.username=${ZIPKIN_RABBIT_USERNAME:}
app.tracing.rabbit.password=${ZIPKIN_RABBIT_PASSWORD:}
