# ── Aplicación ────────────────────────────────────────────────────────────────
spring.application.name=ms-xrello-cuentas
server.port=8007

# ── Eureka Client — elegir perfil segun donde corre esto ───────────────────────
# Sin perfil, el cliente usa el default de Eureka (localhost:8761, sin
# credenciales) — como el Eureka real de este ecosistema siempre pide usuario/
# clave, correr sin perfil falla de forma obvia (401 o connection refused) en
# vez de fallar en silencio contra un hostname que no existe. Es a proposito:
# obliga a elegir uno de los dos siguientes.
#
#   local  → localhost, SIN Docker. Necesita ms1-eureka-server standalone
#            corriendo con este MISMO perfil "local".
#            .\mvnw spring-boot:run "-Dspring-boot.run.profiles=local"
#
#   docker → dentro de contenedores Docker (ver docker-compose.yml). Eureka de
#            alta disponibilidad (3 peers), resueltos por la red "cagr-net".
#            Se activa solo — ver Dockerfile: ENV SPRING_PROFILES_ACTIVE=docker.

# instance-id explicito + prefer-ip-address=true: registro fiable con multiples
# replicas o fuera de Docker Desktop (ver XRELLO_CONTRATO.md §13, "NO HEREDAR").
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# ── SpringDoc / Swagger UI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true

# Swagger UI  → http://localhost:8007/swagger-ui.html
# OpenAPI JSON → http://localhost:8007/api-docs
# OpenAPI YAML → http://localhost:8007/api-docs.yaml

# ── Metadatos de la API (sobreescribibles por perfil de entorno) ───────────────
app.api.title=Xrello — Cuentas
app.api.description=API REST para la gestion de cuentas, usuarios y membresias de Xrello.
app.api.version=1.0.0
app.api.contact.name=Equipo de Desarrollo
app.api.contact.email=dev@empresa.com
app.api.server.url=http://localhost:${server.port}
app.api.server.description=Desarrollo local

# ── Base de datos ──────────────────────────────────────────────────────────────
# Base de datos PROPIA db_xrello, usuario dedicado (NUNCA root, ver
# XRELLO_CONTRATO.md §3). Credenciales SIEMPRE por variable de entorno — el
# default solo existe en application-local.properties para desarrollo local.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_xrello?useSSL=false&serverTimezone=UTC&sessionVariables=time_zone='%2B00:00'&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Pool de conexiones (HikariCP) — limites explicitos ─────────────────────────
# Sin esto el pool queda sin control compartiendo MySQL con el resto del
# ecosistema (ver XRELLO_CONTRATO.md §13, "NO HEREDAR").
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ddl-auto=validate SIEMPRE — el esquema lo gestiona Flyway (ver
# XRELLO_CONTRATO.md §7). show-sql=false: sin ruido, tambien en docker.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Tabla de historial PROPIA — db_xrello es una base FISICA compartida con
# ms-xrello-tableros (ver XRELLO_CONTRATO.md, seccion "FLYWAY EN ESQUEMA
# COMPARTIDO"): con la tabla flyway_schema_history por defecto, ambos
# servicios escribirian su V1/V2/... en la MISMA linea de versiones, y una
# migracion de un servicio puede terminar registrada bajo un numero que ya
# uso el otro (o Flyway puede darla por aplicada sin haberla corrido). Cada
# servicio de Xrello es dueño de su propia tabla de historial, con su propio
# sufijo. Ver sql/01_renombrar_historial_flyway.sql para la migracion
# operativa (una sola vez) desde el nombre por defecto.
#
# PROHIBIDO baseline-on-migrate/baseline-version en Xrello (ver
# XRELLO_CONTRATO.md): si Flyway se queja de "esquema no vacio, sin tabla de
# historial", es señal de que la tabla de historial de ESTE servicio todavia
# no existe en esta base — la reconciliacion es un paso manual, explicito y
# auditado (ver seccion del contrato), nunca una propiedad que lo asuma en
# silencio en cada arranque.
spring.flyway.table=flyway_schema_history_cuentas

# ── Auditoria de ms-commons ──────────────────────────────────────────────────────
# Auditoria de DATOS (INSERT/UPDATE/DELETE, @CustomAuditDataAuditable): activa.
# La tabla auditoria_datos ya existe desde V1__esquema_inicial_cuentas.sql (ver
# db/migration) con el DDL exacto que CustomAuditDataAutoConfiguration/Hibernate
# validan — CustomAuditDataAutoConfiguration se activa con solo tener Hibernate +
# un EntityManagerFactory en el contexto, sin depender de que haya alguna entidad
# ya anotada.
app.audit.enabled=true

# Auditoria de ACCESOS (peticiones HTTP, @CustomAuditAccessAuditable): DESACTIVADA
# de forma PERMANENTE, no transitoria. Un tablero kanban genera muchas peticiones
# por sesion de usuario (arrastrar una tarjeta, reordenar una lista, refrescar el
# tablero, comentar, etc.) — auditar cada acceso inflaria auditoria_peticiones_api
# sin aportar nada que el log de aplicacion o las metricas de Actuator no den ya.
# Este flag es el interruptor MAESTRO de todo el mecanismo (condiciona si
# CustomAuditAccessAutoConfiguration se activa siquiera) — con el en false,
# ningun @CustomAuditAccessAuditable puntual funcionaria aunque se anotara un
# endpoint. Si en el futuro un endpoint puntual y sensible necesita trazabilidad
# de accesos, la decision de reactivar este flag (y crear antes la tabla
# auditoria_peticiones_api) se toma en ese momento, explicitamente — no antes.
app.audit.access.enabled=false

# ── Actuator — health check ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Sin esto, Eureka reporta UP mientras el proceso este vivo sin importar lo que
# diga /actuator/health.
eureka.client.healthcheck.enabled=true
# spring-boot-starter-amqp esta en el classpath solo para que ms-commons introspeccione sus
# @ConditionalOnBean(RabbitTemplate.class) (ver ms-commons/CLAUDE.md §12; app.audit.rabbit.enabled
# queda en false aqui). Sin spring.rabbitmq.* propio, el RabbitHealthIndicator por defecto de Boot
# prueba localhost:5672 guest/guest, que no existe, y queda DOWN siempre — con el
# eureka.client.healthcheck de arriba eso saca a este servicio de rotacion por un Rabbit que ni
# siquiera usa (D26/D27: RabbitMQ caido nunca debe afectar al negocio). Apagado.
management.health.rabbit.enabled=false

# ── Seguridad — JWT (ver security/) ─────────────────────────────────────────────
# Clave HS256 SIN default aqui ni en application-docker.properties — arranque
# falla si falta (ver security.JwtConfig, valida minimo 32 bytes en @PostConstruct).
# Solo application-local.properties trae un default de desarrollo documentado.
app.security.jwt.secret=${XRELLO_JWT_SECRET}
app.security.jwt.access-token-minutes=30
app.security.jwt.refresh-token-days=60

# ── Directorio centralizado de identidades (ms-usuario, D28/Tesela) ────────────────
# El login y el alta de cuenta se verifican/crean contra ms-usuario (ver
# security.identidad.UsuarioDirectorioClient), nunca contra una tabla local de contrasenas.
# SIN default aqui: arranque falla si falta (ver el constructor de UsuarioDirectorioClient).
app.directorio.usuario.base-url=http://ms-usuario
app.directorio.usuario.internal-token=${USUARIO_INTERNAL_TOKEN}

# ── API Gateway (ms2-gateway-server) ───────────────────────────────────────────
# Rutas que ESTE servicio publica en Eureka; el gateway las lee y enruta solo, sin
# redesplegarse. Sin esta metadata el servicio NO se expone por el gateway.
# Nunca publicar /api/admin/** ni /actuator/** (el gateway las rechaza).
eureka.instance.metadata-map.gateway-paths=/api/v1/publico/**,/api/v1/cuentas/**,/api/v1/admin/**

# ── JWKS del Authorization Server: cache tolerante a caidas del emisor (ver JwksDecoderFactory) ──
# Audiencias (claim aud) que este servicio acepta de tokens de ms3-oauth (CONTRATO_PLATAFORMA.md 1.2). Por
# defecto, su propio nombre; el token vale si ALGUNA de sus aud esta en la lista. NO se valida en el
# emisor local HS256 (transitorio, no emite aud).
#   app.security.audiences=ms-xrello-cuentas
# Solo aplica cuando se define spring.security.oauth2.resourceserver.jwt.jwk-set-uri (perfiles local/docker).
# El decoder POR DEFECTO de Spring cachea 5 min y despues rechaza TODO si el emisor cae (medido: 300 s).
# Estos valores son los recomendados; subir outage-tolerance da mas disponibilidad ante una caida larga pero
# deja mas tiempo una llave retirada por compromiso (la desconfianza queda acotada a ese plazo).
#   app.security.jwks.cache-ttl=5m
#   app.security.jwks.outage-tolerance=1h
#   app.security.jwks.min-refetch-interval=5s
#   app.security.jwks.connect-timeout=2s
#   app.security.jwks.read-timeout=2s

# ── Trazas distribuidas (Micrometer Tracing + Brave -> RabbitMQ -> Zipkin -> Elasticsearch) ──────────
# Ver infra-tracing/. Las trazas se CREAN siempre (traceId/spanId en los logs y propagados a los demas
# servicios); si se EXPORTAN lo deciden los perfiles: local lo apaga salvo TRACING_ENABLED=true, docker lo enciende.
# 1.0 = todas las peticiones (desarrollo). En produccion bajarlo (0.1) para acotar el costo.
management.tracing.sampling.probability=1.0

# ── Mensajeria: envio de correo por ms-mensajeria (cliente de ms-commons) ──────────────────────────────────────
# La URL de ms-mensajeria NO se fija aqui: la lee el cliente de la TABLA DE PARAMETRIZACION (parametro URL_MENSAJERIA de
# este servicio, ver ms-mensajeria/CLAUDE.md §4). La unica credencial es la API key del cliente "Proyectos" (secreto,
# D25): identifica a este servicio para llevar su conteo de correos. Comunicacion interna: sin OAuth ni gateway.
app.mensajeria-client.enabled=true
app.mensajeria-client.api-key=${MENSAJERIA_API_KEY}
# El TimeLimiter debe superar la suma de reintentos del cliente (el defecto de Resilience4j, 1 s, los cortaria).
resilience4j.timelimiter.instances.mensajeria.timeout-duration=15s
resilience4j.circuitbreaker.instances.mensajeria.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.mensajeria.sliding-window-size=10
resilience4j.circuitbreaker.instances.mensajeria.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mensajeria.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mensajeria.wait-duration-in-open-state=10s

# BUG-E2E-020: el circuito "usuarios" (UsuarioDirectorioClient, llamadas a ms-usuario) se quedaba con
# el defecto de Resilience4j (TimeLimiter de 1 s) -- UsuarioDirectorioClient.crear() es una sola llamada
# HTTP a ms-usuario cuyo endpoint hace bcrypt + INSERT + generar/guardar el token + llamar a ms-mensajeria
# (con SU PROPIO circuito, ver ms-usuario) antes de responder; en frio (primer alta de una corrida E2E,
# pools de conexion aun sin calentar) esa cadena supera 1 s. El TimeLimiter cortaba la espera y devolvia
# 503 al navegador aunque ms-usuario terminaba la creacion y el correo de verificacion SI llegaba a la
# base (confirmado en los logs: "token de verificacion invalido" nunca aparecia por un token roto, sino
# porque el intento se marcaba como fallido en el cliente mientras el servidor seguia trabajando) -- mismo
# sintoma que ya se corrigio para "mensajeria" arriba, nunca aplicado aqui.
resilience4j.timelimiter.instances.usuarios.timeout-duration=20s
resilience4j.circuitbreaker.instances.usuarios.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.usuarios.sliding-window-size=10
resilience4j.circuitbreaker.instances.usuarios.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.usuarios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.usuarios.wait-duration-in-open-state=10s
