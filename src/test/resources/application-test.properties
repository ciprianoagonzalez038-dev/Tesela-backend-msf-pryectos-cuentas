# Perfil "test" — usado SOLO por AbstractIntegrationTest (Testcontainers MySQL).
# spring.datasource.* lo sobreescribe @DynamicPropertySource con los datos del
# contenedor; aqui solo va lo que no depende del contenedor.
eureka.client.enabled=false

# Ni "local" ni "docker" estan activos en los tests -- application.properties no trae default
# para esta clave a proposito (ver security.JwtConfig); se fija aqui, solo para tests (>= 32 bytes).
app.security.jwt.secret=xrello-jwt-secreto-de-test-nunca-usar-fuera-de-testcontainers-2026

# Mismo motivo que la clave de arriba -- application.properties no trae default para este secreto
# compartido con ms-usuario (D28/Tesela, ver security.identidad.UsuarioDirectorioClient). Ningun
# test de este modulo llama a ms-usuario de verdad (UsuarioDirectorioClient es @Profile("!test"),
# StaticTestUsuarioDirectorioPort lo sustituye) -- este valor solo existe para que el contexto
# arranque sin el literal "${...}" sin resolver (>= 32 caracteres).
app.directorio.usuario.internal-token=xrello-token-interno-de-test-nunca-usar-fuera-de-testcontainers
app.mensajeria-client.api-key=tsl_0a1b2c3d_clave-solo-para-testcontainers-nunca-real-1234
